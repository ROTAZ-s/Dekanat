<style>
:root{--bg:#000;--ink:#fff;--acc:#37FF08;--on:#000;--s1:3px;--s2:7px;--s3:10px;--s4:21px;--s5:30px;--s6:70px;
--disp:"Climate Crisis","Arial Black",Arial,sans-serif;--text:"Geologica",Arial,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--text);font-size:16px;line-height:1.45;text-align:right;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
a{color:var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.disp{font-family:var(--disp);letter-spacing:-.02em;text-transform:uppercase;line-height:.95;padding-right:.08em}
.lbl{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.acc{color:var(--acc)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--disp);letter-spacing:-.02em;text-transform:uppercase;font-size:26px;line-height:1;padding-right:.08em}
p{margin:0}
.concept{border-bottom:1px solid var(--ink);padding:var(--s2) 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:3px solid var(--ink)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding-block:var(--s3)}
.logo{display:flex;align-items:center;gap:var(--s2);font-family:var(--disp);letter-spacing:-.07em;font-size:18px;text-transform:uppercase;background:none;border:0;padding:0;cursor:pointer}
.logo i{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--acc);color:var(--on);font-style:normal;font-size:20px;letter-spacing:0}
.ibtn{min-width:44px;height:44px;border:3px solid var(--ink);background:var(--bg);font-weight:800;cursor:pointer;padding:0 var(--s3)}
.ibtn:focus-visible,.btn:focus-visible,.chip:focus-visible,nav.tabs button:focus-visible,.opt:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
main{display:flex;flex-direction:column;gap:var(--s5);padding-block:var(--s5)}
section{display:flex;flex-direction:column;gap:var(--s3)}
.card{border:3px solid var(--ink);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.card.thin{border-width:1px}
.row{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--s2);align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:var(--s3) var(--s4);border:3px solid var(--ink);background:var(--bg);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:14px;cursor:pointer;border-radius:0}
.btn.main{background:var(--acc);border-color:var(--acc);color:var(--on);box-shadow:7px 7px 0 var(--ink)}
.btn.main:active{transform:translate(3px,3px);box-shadow:4px 4px 0 var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{border-width:1px;min-height:44px;font-size:12px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);padding:2px var(--s2);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.tag.g{border-color:var(--acc);color:var(--acc)}
.tag.fill{background:var(--acc);color:var(--on);border-color:var(--acc)}
.muted{opacity:.75}
.small{font-size:13px;line-height:1.4}
.big{font-size:20px;line-height:1.3;font-weight:600}
.what{font-size:19px;line-height:1.3;font-weight:600}
.task{display:grid;grid-template-columns:1fr 44px;gap:var(--s3);align-items:start;padding-block:var(--s3);border-bottom:1px solid var(--ink)}
.task:last-child{border-bottom:0}
.task > div{min-width:0}
.check{width:44px;height:44px;border:3px solid var(--ink);background:var(--bg);cursor:pointer;display:grid;place-items:center;font-weight:800;font-size:20px}
.check[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on)}
.task.done .t{text-decoration:line-through;opacity:.6}
.lesson{display:grid;grid-template-columns:1fr auto;gap:var(--s3);padding-block:var(--s3);border-bottom:1px solid var(--ink)}
.lesson > div{min-width:0}
.lesson .tm{font-weight:800;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chg{border:1px dashed var(--acc);padding:var(--s2);margin-top:var(--s2);font-size:13px}
.days{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--s2)}
.chip{min-width:48px;min-height:44px;border:3px solid var(--ink);background:var(--bg);font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.blocks{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px}
.blocks span{width:14px;height:14px;border:1px solid var(--ink)}
.blocks span.p{background:var(--ink)}
.blocks span.g{background:var(--acc);border-color:var(--acc)}
.bitem{display:grid;grid-template-columns:1fr auto;gap:var(--s3);align-items:center;padding-block:var(--s2);border-bottom:1px solid var(--ink)}
.bitem > div{min-width:0}
.bitem.off .t{opacity:.55}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.st b{display:inline-grid;place-items:center;width:20px;height:20px;border:2px solid currentColor;font-size:12px}
.st.ready{color:var(--acc)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s2)}
.timeline li{border-right:3px solid var(--ink);padding-right:var(--s3)}
.timeline li.on{border-color:var(--acc)}
.orig{border-top:1px dashed var(--ink);padding-top:var(--s3);font-size:13px;line-height:1.5;text-align:left;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:var(--s2)}
.opt{text-align:right;width:100%;min-height:52px;padding:var(--s3) var(--s4);border:3px solid var(--ink);background:var(--bg);font-weight:600;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.field{display:flex;flex-direction:column;gap:var(--s2);align-items:stretch}
.field label{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.inp{width:100%;min-height:52px;padding:var(--s3);border:3px solid var(--ink);background:var(--bg);text-align:right;font-size:18px;border-radius:0}
.inp:focus{outline:3px solid var(--acc);outline-offset:0}
.pw{display:grid;grid-template-columns:auto 1fr;gap:var(--s2)}
.err{border:3px solid var(--ink);background:var(--ink);color:var(--bg);padding:var(--s3);font-weight:600}
.ok{border:3px solid var(--acc);padding:var(--s3);font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:3px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding-block:6px}
nav.tabs button{min-height:52px;background:var(--bg);border:0;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:4px 2px}
nav.tabs button[aria-current="page"]{background:var(--acc);color:var(--on)}
.end{border:3px solid var(--acc);padding:var(--s5) var(--s4);display:flex;flex-direction:column;gap:var(--s3);align-items:flex-end}
.end .disp{font-size:clamp(34px,11vw,64px)}
.hero h1{font-size:clamp(40px,14vw,92px)}
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.doc{background:var(--ink);color:var(--bg);padding:var(--s4);text-align:left;font-size:14px;line-height:1.5;position:relative;overflow:hidden}
.doc .wm{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:56px;letter-spacing:-.05em;opacity:.08;transform:rotate(-18deg);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details summary{cursor:pointer;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:12px;min-height:44px;display:flex;align-items:center;justify-content:flex-end}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dayAt=o=>{const d=today();d.setDate(d.getDate()+o);return d};
const fmtD=d=>d.getDate()+" "+MONTHS[d.getMonth()];

const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;return n>10&&n<20?c:m>1&&m<5?b:m===1?a:c};
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...u)),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(s){return [...new Uint8Array(await crypto.subtle.digest("SHA-256",enc.encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("")}

/* ---------- crypto ---------- */
async function deriveKey(pass,saltB64){
  const raw=await hashwasm.argon2id({password:pass.normalize("NFC"),salt:ub64(saltB64),parallelism:KDF.p,iterations:KDF.t,memorySize:KDF.m,hashLength:32,outputType:"binary"});
  return crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]);
}
async function decryptJSON(key,ivB64,ctB64){return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(ivB64)},key,ub64(ctB64))))}
async function encryptJSON(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(obj))));return {iv:b64(iv),ct:b64(ct)}}
const LKEY=()=>"cd:"+S.lid.slice(0,24);
async function saveLocal(){try{localStorage.setItem(LKEY(),JSON.stringify(await encryptJSON(S.key,S.loc)))}catch(e){}}
async function loadLocal(){try{const r=localStorage.getItem(LKEY());if(r){const o=JSON.parse(r);return await decryptJSON(S.key,o.iv,o.ct)}}catch(e){}return {done:{},steps:{},picks:null,reqs:[],uploads:{},topic:null}}

async function login(user,pass){
  const lid=await sha("login:"+user.trim().toLowerCase());
  const entry=DATA[lid];
  const salt=entry?entry.salt:"AAAAAAAAAAAAAAAAAAAAAA==";
  let key;try{key=await deriveKey(pass,salt)}catch(e){return false}
  if(!entry)return false;
  try{const base=await decryptJSON(key,entry.iv,entry.ct);S={lid,key,base,loc:null};S.loc=await loadLocal();return true}catch(e){return false}
}
function logout(msg){S=null;clearTimeout(idleT);location.hash="";renderLogin(msg)}
function touch(){clearTimeout(idleT);idleT=setTimeout(()=>logout("Мы вышли из кабинета: 15 минут без действий. Данные снова зашифрованы."),15*60*1000)}
["click","keydown","touchstart"].forEach(e=>addEventListener(e,()=>{if(S)touch()},{passive:true}));

/* ---------- login ---------- */
function failDelay(){let n=0;try{n=+sessionStorage.getItem("cd:f")||0}catch(e){}return n<3?0:Math.min(30,2**(n-2))}
function addFail(){try{sessionStorage.setItem("cd:f",(+sessionStorage.getItem("cd:f")||0)+1)}catch(e){}}
function resetFail(){try{sessionStorage.removeItem("cd:f")}catch(e){}}

        <p class="small muted">Пароль здесь это длинная фраза из простых слов. Заглавные и спецсимволы не нужны: длина защищает лучше, так советует стандарт NIST 2025 года. Вставка и менеджеры паролей разрешены.</p>
      </div>
      <div id="lerr"></div>
      <button class="btn main" id="go" type="submit">Войти</button>
    </form>

      <p class="small">alina.k / teplyi-dvor-v-chetverg<br>mark.s / zelenaya-lampa-nad-stolom</p>

/* ---------- derived data ---------- */
const B=()=>S.base,L=()=>S.loc;
function reqStatus(r){
  if(!r.local)return {status:r.status,history:r.history.map(([o,s])=>[fmtD(dayAt(o)),s])};
  const el=(Date.now()-r.ts)/1000,h=[[new Date(r.ts),"sent"]];
  if(el>20)h.push([new Date(r.ts+20000),"accepted"]);
  if(el>60)h.push([new Date(r.ts+60000),"ready"]);
  return {status:h[h.length-1][1],history:h.map(([d,s])=>[d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}),s]),demo:true};
}
const allReqs=()=>[...L().reqs.map(r=>({...r,local:true})),...B().requests];
const noticeDone=n=>!!L().done[n.id];
const TD=()=>today().toISOString().slice(0,10);
const doneBefore=id=>{const v=L().done[id];return v&&v!==true&&v<TD()};
function todayTasks(){
  const t=[];
  for(const n of B().notices){if(n.plain.due==null)continue;const done=noticeDone(n);let label=n.plain.do,time=n.plain.time;
    if(n.route){const i=n.route.findIndex((s,k)=>!L().steps[n.id+":"+k]);if(i>=0){label=tpl(n.route[i][0]);time=n.route[i][1]}}
    t.push({id:n.id,label:tpl(label),time,due:n.plain.due,done,nid:n.id})}
  const picks=L().picks||[];
  for(const b of B().budget){if(picks.includes(b.id)&&!b.from)t.push({id:"b:"+b.id,label:b.title,time:hrs(b.hours),due:b.due,done:!!L().done["b:"+b.id]})}
  return t.filter(x=>!doneBefore(x.id)).sort((a,b)=>a.due-b.due).slice(0,3);
}
const hrs=h=>h<1?Math.round(h*60)+" минут":h===1?"1 час":h+" "+plural(h,"час","часа","часов");

function bindTasks(){document.querySelectorAll("[data-task]").forEach(b=>b.onclick=async()=>{const id=b.dataset.task;

  if(n&&n.route){const i=n.route.findIndex((s,k)=>!L().steps[id+":"+k]);if(i>=0){L().steps[id+":"+i]=TD()}L().done[id]=n.route.every((x,k)=>L().steps[id+":"+k])?TD():false}
  else L().done[id]=L().done[id]?false:TD();
  await saveLocal();say("Отмечено");route()})}

function vWeek(sel){
  const wd=new Date().getDay();const d=sel??(wd===0?1:wd);
  const pairs=B().schedule.filter(l=>l.kind!=="по желанию").length,ph=Math.round(pairs*1.33);
  const items=B().budget.filter(b=>b.due<=10),need=items.reduce((a,b)=>a+b.hours,0);
  const picks=L().picks||[];
  const free=168-56-ph-14;
  const blocks=[...Array(ph)].map(()=>'<span class="p"></span>').join("")+items.map(b=>[...Array(Math.max(1,Math.round(b.hours)))].map(()=>`<span class="${picks.includes(b.id)?"g":""}"></span>`).join("")).join("");
  shell("week",`
  <section><h1 class="disp" style="font-size:clamp(34px,10vw,56px)">Неделя</h1>
  <div class="days" role="group" aria-label="День недели">${[1,2,3,4,5,6].map(i=>`<button class="chip" data-day="${i}" aria-pressed="${i===d}">${WDS[i]}</button>`).join("")}</div></section>
  <section>${lessonsOn(d).length?lessonsOn(d).map(lessonHtml).join(""):"<p>В этот день пар нет.</p>"}</section>
  <section class="card"><span class="lbl">Бюджет недели</span><h2>Всё не успеть. И это нормально</h2>
    <p>В неделе 168 часов. Сон забирает около 56, пары ${ph}, дорога и еда ещё около 14. Остаётся примерно ${free} часов на всё остальное, включая жизнь. Дела со сроком в ближайшие 10 дней тянут на ${Math.round(need)} ${plural(Math.round(need),"час","часа","часов")}.</p>
    <div class="blocks" aria-hidden="true">${blocks}</div>
    <p class="small muted">Белые клетки это пары, рамки это дела, зелёные это то, что ты выбрал главным. Одна клетка = 1 час.</p>
    <p class="what">Выбери три главных дела на эту неделю${picks.length?`: выбрано ${picks.length} из 3`:""}.</p>
    <div>${items.sort((a,b)=>a.due-b.due).map(b=>{const on=picks.includes(b.id),off=picks.length>=3&&!on;return `<div class="bitem ${off?"off":""}"><div><p class="t">${esc(b.title)}</p><p class="small muted">${hrs(b.hours)}, срок ${fmtO(b.due)}${off?". Не в этот раз":""}</p></div><button class="chip" data-pick="${b.id}" aria-pressed="${on}" ${off?"disabled":""}>${on?"Главное":"Выбрать"}</button></div>`}).join("")}</div>
    ${picks.length>=3?`<p class="ok">Готово. Эти три дела появятся в «Сегодня». Остальное не провал, а осознанное «не в этот раз».</p>`:""}
  </section>`);
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>vWeek(+b.dataset.day));
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=async()=>{const id=b.dataset.pick;let p=L().picks||[];p=p.includes(id)?p.filter(x=>x!==id):p.length<3?[...p,id]:p;L().picks=p;await saveLocal();vWeek(d)});
}

  if(step==="what"){q("Что нужно?","Один вопрос на экран. Всё, что мы о тебе знаем, подставим сами.",[["study","Справка об обучении"],["call","Справка-вызов на сессию (для работодателя)"],["topic","Заявление: выбрать тему курсовой"],["dunno","Не знаю, что нужно. Подскажите"]])}
  else if(step==="dunno"){q("Что случилось?","Опиши ситуацию, а нужную бумагу подберём мы.",[["study:military","Иду в военкомат"],["study:bank","Банк просит подтвердить учёбу"],["call:work","Работодатель должен отпустить на сессию"],["study:visa","Оформляю визу"],["study:social","Оформляю льготу в соцзащите"]])}
  else if(step==="dest"){q("Куда понесёшь справку?","От этого зависит текст справки.",Object.entries(DEST))}
  else if(step==="topic"){q("Какая тема?","Список утверждён академическим руководителем.",TOPICS.map((t,i)=>[i,t]))}
  else if(step==="copies"){q("В каком виде?","Электронная с подписью готова быстрее и подходит почти везде.",[["электронная с подписью","Электронная с подписью"],["бумажная","Бумажная, заберу в учебном офисе"]])}
  else if(step==="check"){
    const p=B().profile;
    shell("req",`<section>${back}<span class="lbl">Проверь и отправь</span><h1 class="disp" style="font-size:clamp(28px,8vw,44px)">${REQ_TYPES[draft.type]}</h1></section>
    <section class="card"><p>${esc(p.name)}, ${p.course} курс, ${esc(p.program)}, группа ${esc(p.group)}</p>${draft.dest?`<p>Куда: ${DEST[draft.dest]}</p>`:""}${draft.copies?`<p>Вид: ${esc(draft.copies)}</p>`:""}${draft.note?`<p>${esc(draft.note)}</p>`:""}</section>
    <div id="dup"></div><button class="btn main" id="send">Отправить</button>`);
    $("#send").onclick=async()=>{
      const same=allReqs().find(r=>r.type===draft.type&&r.dest==draft.dest&&reqStatus(r).status!=="ready");
      if(same){$("#dup").innerHTML=`<div class="err" role="alert">Такая заявка уже в работе: № ${same.id.replace("r-","")}. Вторая не нужна.</div>`;$("#send").disabled=true;return}
      $("#send").disabled=true;
      const id="r-"+(3000+L().reqs.length+1);
      L().reqs.unshift({id,type:draft.type,dest:draft.dest||null,copies:draft.copies||"заявление",note:draft.note,ts:Date.now()});
      if(draft.type==="topic"){const n=B().notices.find(x=>x.id==="n-course");if(n)L().done[n.id]=TD()}
      if(draft.dest==="military"){const n=B().notices.find(x=>x.id==="n-mil");if(n)L().done[n.id]=TD()}
      await saveLocal();draft={};say("Заявка отправлена");location.hash="#/r/"+id};
  }
  const bk=$("#bk");if(bk)bk.onclick=()=>history.back();
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const v=b.dataset.v;
    if(step==="what"){if(v==="dunno")return go("dunno");draft={type:v};return go(v==="topic"?"topic":v==="call"?"copies":"dest")}
    if(step==="dunno"){const [t,dst]=v.split(":");draft={type:t,dest:dst};return go("copies")}
    if(step==="dest"){draft.dest=v;return go("copies")}
    if(step==="topic"){draft.note="Тема: «"+TOPICS[+v]+"»";draft.copies="заявление";return go("check")}
    if(step==="copies"){draft.copies=v;return go("check")}
  });
  function go(s){location.hash="#/new/"+s}
}

function noticeCard(n,full){
  const pl=n.plain,done=noticeDone(n);
  return `<article class="card ${full?"":"thin"}">
  <div class="row" style="justify-content:space-between"><span class="tag g">Переведено с деканатского</span><span class="small muted">${esc(n.from)}, ${fmtO(n.dayOffset)}</span></div>
  <p class="what">${esc(tpl(pl.what))}</p>
  <div class="row"><span class="tag">Что сделать: ${esc(pl.do)}</span><span class="tag">Займёт: ${esc(pl.time)}</span>${pl.due!=null?`<span class="tag ${done?"":"fill"}">${done?"Сделано":"До "+fmtO(pl.due)}</span>`:""}</div>
  <p class="small">${esc(tpl(pl.why))}</p>
  ${full?"":`<button class="btn ghost" data-open="${n.id}">Открыть</button>`}
  </article>`;
}
function vDean(){
  const ns=[...B().notices].sort((a,b)=>(noticeDone(a)-noticeDone(b))||((a.plain.due??99)-(b.plain.due??99)));
  shell("dean",`<section><h1 class="disp" style="font-size:clamp(34px,10vw,56px)">Деканат</h1><p>Все приказы и письма уже переведены на человеческий. Оригинал всегда рядом, одной кнопкой.</p></section>
  <section>${ns.map(n=>noticeCard(n,false)).join("")}</section>`);bindOpen();
}
function vNotice(id){
  const n=B().notices.find(x=>x.id===id);
  if(!n){shell("dean",`<section class="card"><h2>Такого сообщения у тебя нет</h2><p>Возможно, ссылка из чужого кабинета.</p></section>`);return}
  const steps=n.route?`<section class="card"><span class="lbl">Маршрут</span><h2>По шагам, без паники</h2><ol class="steps">${n.route.map((s,k)=>{const on=!!L().steps[n.id+":"+k];return `<li class="task ${on?"done":""}"><div><p class="t what">${esc(tpl(s[0]))}</p><p class="small muted">${esc(s[1])}</p></div><button class="check" data-step="${k}" aria-pressed="${on}" aria-label="Шаг ${k+1}">${on?"✓":k+1}</button></li>`}).join("")}</ol><p class="small muted">Долг это не приговор, а тренировка. Первый шаг самый короткий.</p></section>`:"";
  const act=n.id==="n-course"?`<button class="btn main" id="act">Выбрать тему</button>`:n.id==="n-mil"?`<button class="btn main" id="act">Заказать справку для военкомата</button>`:n.id==="n-flu"?`<label class="btn main" for="up">Загрузить справку</label><input id="up" type="file" accept="image/*,application/pdf" class="sr">${L().uploads[n.id]?`<p class="ok">Загружено: ${esc(L().uploads[n.id])}. Медпункт проверит.</p>`:""}`:(!n.route&&n.plain.due!=null?`<button class="btn main" id="mark">${noticeDone(n)?"Вернуть в дела":"Отметить сделанным"}</button>`:"");
  shell("dean",`<section><button class="btn ghost" id="back">← Деканат</button><span class="lbl">${esc(n.title)}</span></section>${noticeCard(n,true)}${steps}
  <section class="row">${act}</section>
  <details class="card thin"><summary>Показать оригинал</summary><div class="orig">${esc(tpl(n.orig))}</div></details>
  <p class="small muted">Перевод сделала нейросеть на стороне деканата, сотрудник проверил и подтвердил. Даты и сроки берутся из полей приказа, а не из текста нейросети.</p>`);
  $("#back").onclick=()=>location.hash="#/dean";
  document.querySelectorAll("[data-step]").forEach(b=>b.onclick=async()=>{const k=+b.dataset.step,key=n.id+":"+k;L().steps[key]=!L().steps[key];L().steps[key]=L().steps[key]?TD():false;L().done[n.id]=n.route.every((s,i)=>L().steps[n.id+":"+i])?TD():false;await saveLocal();vNotice(id)});
  const a=$("#act");if(a)a.onclick=()=>{draft=n.id==="n-course"?{type:"topic"}:{type:"study",dest:"military"};location.hash=n.id==="n-course"?"#/new/topic":"#/new/copies"};
  const m=$("#mark");if(m)m.onclick=async()=>{L().done[n.id]=L().done[n.id]?false:TD();await saveLocal();vNotice(id)};
  const u=$("#up");if(u)u.onchange=async()=>{const f=u.files[0];if(!f)return;L().uploads[n.id]=f.name;L().done[n.id]=TD();await saveLocal();vNotice(id)};
}
function vProfile(){
  const p=B().profile;
  shell("today",`<section><button class="btn ghost" id="back">← Назад</button><h1 class="disp" style="font-size:clamp(30px,9vw,48px)">${esc(p.name)}</h1></section>
  <section class="card">${[["Факультет",p.faculty],["Направление",p.program],["Курс",p.course],["Группа",p.group],["Зачётка",p.record],["Форма",p.form],["Куратор",p.advisor]].map(([k,v])=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid #fff;padding-block:7px"><span class="lbl">${k}</span><span>${esc(v)}</span></div>`).join("")}</section>
  <section class="card thin"><span class="lbl">Мои данные под замком</span><p>Всё, что ты видишь, лежит в зашифрованном сейфе. Ключ собирается из твоей пароль-фразы в телефоне и пропадает, когда ты выходишь. Твои отметки и заявки тоже шифруются перед сохранением. Через 15 минут без действий кабинет закрывается сам.</p></section>
  <section class="card thin"><span class="lbl">На экран «Домой»</span><p>iPhone: Safari, кнопка «Поделиться», «На экран Домой». Android: меню браузера, «Установить приложение».</p></section>
  <button class="btn" id="out">Выйти</button>`);
  $("#back").onclick=()=>history.back();$("#out").onclick=()=>logout("Ты вышел. Ключ стёрт из памяти.");
}
function vHelp(){
  shell("today",`<section><button class="btn ghost" id="back">← Назад</button><h1 class="disp" style="font-size:clamp(30px,9vw,48px)">Помощь</h1></section>
  <section class="card"><span class="lbl">Учебный офис</span><p>Каб. 120, пн–пт 10:00–17:00</p><p>Почта и телефон вымышлены для концепта: office@example.edu, +7 000 000-00-00</p></section>
  <section class="card thin"><span class="lbl">Частые вопросы</span>
  <details><summary>Не понимаю, какая справка нужна</summary><p>Заявки, «Новая заявка», «Не знаю, что нужно». Выбери ситуацию, бумагу подберём.</p></details>
  <details><summary>Где оригинал приказа</summary><p>Деканат, открой сообщение, «Показать оригинал».</p></details>
  <details><summary>Забыл пароль-фразу</summary><p>Её знаешь только ты, даже деканат не может её прочитать. Восстановление через учебный офис по паспорту.</p></details></section>`);
  $("#back").onclick=()=>history.back();
}
function route(){
  if(!S){renderLogin();return}
  const h=location.hash.replace(/^#\/?/,"").split("/");
  const [a,b]=h;
  if(a==="today"||!a)vToday();else if(a==="week")vWeek();else if(a==="study")vStudy();
  else if(a==="req")vReq();else if(a==="r")vReqOne(b);else if(a==="new"){if(!b){draft={}}vNew(b||"what")}
  else if(a==="dean")vDean();else if(a==="n")vNotice(b);else if(a==="profile")vProfile();else if(a==="help")vHelp();else vToday();
  const h1=document.querySelector("main h1");if(h1){h1.setAttribute("tabindex","-1");h1.focus({preventScroll:true})}
}
addEventListener("hashchange",route);
setInterval(()=>{if(S&&/^#\/r\//.test(location.hash))route()},10000);
route();
</script>
</body>
